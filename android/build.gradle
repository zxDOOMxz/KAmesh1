// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '35.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '35')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '34')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.25'

        ndkVersion = "26.1.10909125"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"

def patchAarActionBarSize(aarFile) {
    if (!aarFile.exists()) return
    def tempFile = File.createTempFile("patched", ".aar")
    tempFile.delete()
    def modified = false
    def buffer = new byte[8192]
    def zipOut = new java.util.zip.ZipOutputStream(new FileOutputStream(tempFile))
    def originalZip = new java.util.zip.ZipFile(aarFile)
    originalZip.entries().each { entry ->
        if (entry.name == "res/values/values.xml") {
            def content = originalZip.getInputStream(entry).text
            def cleaned = content.replaceAll(
                /(?m)^\s*<attr\s+name="actionBarSize"[^>]*\/>\s*\n?/,
                ''
            )
            if (content != cleaned) { modified = true; content = cleaned }
            zipOut.putNextEntry(new java.util.zip.ZipEntry(entry.name))
            zipOut.write(content.bytes)
            zipOut.closeEntry()
        } else {
            zipOut.putNextEntry(new java.util.zip.ZipEntry(entry.name))
            def is = originalZip.getInputStream(entry)
            int len
            while ((len = is.read(buffer)) > 0) { zipOut.write(buffer, 0, len) }
            is.close()
            zipOut.closeEntry()
        }
    }
    originalZip.close()
    zipOut.close()
    if (modified) {
        aarFile.delete()
        tempFile.renameTo(aarFile)
        println "Patched actionBarSize in ${aarFile.name}"
    } else {
        tempFile.delete()
    }
}

allprojects {
    configurations.configureEach {
        resolutionStrategy {
            force 'com.google.android.material:material:1.12.0'
            force 'androidx.appcompat:appcompat:1.7.0'
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
            force 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
            force 'androidx.fragment:fragment:1.8.0'
            force 'androidx.activity:activity:1.9.0'
            cacheDynamicVersionsFor 10, 'seconds'
            cacheChangingModulesFor 10, 'seconds'
        }
        incoming.afterResolve { resolvableDependencies ->
            resolvableDependencies.files.each { f ->
                if (f.name.contains("material-1.12.0") && f.name.endsWith(".aar")) {
                    patchAarActionBarSize(f)
                }
            }
        }
    }

    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}
