// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '35.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '35')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '34')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.25'

        ndkVersion = "26.1.10909125"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"

// react-native-simple-crypto тянет com.android.support:appcompat-v7:23.0.1 → support-v4:23.0.1
// В CI oss.sonatype.org возвращает 504 на этот артефакт, что отключает репозиторий и валит билд.
// Модуль НЕ импортирует support-классы (только android.* и com.facebook.react.*), исключение безопасно.
subprojects { subproject ->
    subproject.configurations.all {
        exclude group: 'com.android.support'
    }
}

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }

        // Sonatype snapshots — RN Gradle Plugin дублирует этот repo в afterEvaluate БЕЗ content filter-ов.
        // Добавляем ПОСЛЕ google/mavenCentral с фильтрами, чтобы stable артефакты (>99% зависимостей)
        // резолвились из google/mavenCentral, а не из oss.sonatype.org (который в CI недоступен и выдаёт 504,
        // ломая весь билд). Фильтры гарантируют, что в Sonatype ходят только react-native snapshot-ы.
        maven {
            url 'https://oss.sonatype.org/content/repositories/snapshots/'
            content {
                excludeGroupByRegex("androidx?\\..*")
                excludeGroupByRegex("com\\.android\\..*")
                excludeGroupByRegex("com\\.google\\..*")
            }
        }
    }
}
