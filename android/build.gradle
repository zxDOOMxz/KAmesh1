// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '35.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '35')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '34')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.25'

        ndkVersion = "26.1.10909125"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        // Локальный репозиторий с пропатченным material AAR (без actionBarSize)
        maven { url "${rootDir}/patched-material-repo" }

        maven {
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }

    // @react-native/gradle-plugin (DependencyUtils.kt:37) добавляет oss.sonatype.org в afterEvaluate.
    // В CI он недоступен (504), что валит резолв зависимостей с -SNAPSHOT.
    // Удаляем его сразу после того, как плагин его добавил.
    afterEvaluate { project ->
        project.repositories.removeAll { repo ->
            repo instanceof MavenArtifactRepository && repo.url.toString().contains("sonatype")
        }
    }
}

// Выравнивание версий AndroidX/material — разные модули (expo-dev-menu 1.2.1,
// react-native-screens 1.6.1) тянут разные версии, ресурсы пересекаются → AAPT2 падает.
subprojects {
    configurations.all {
        resolutionStrategy {
            force 'androidx.appcompat:appcompat:1.6.1'
            force 'com.google.android.material:material:1.9.0-patched'
            force 'androidx.activity:activity:1.9.3'
            force 'androidx.core:core:1.15.0'
        }
    }
}
